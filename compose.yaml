name: acervo

services:
  acervo:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        YTDLP_EM: ${YTDLP_EM:-nunca}
    image: acervo:${VERSION:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    # CLAUDE_CODE_OAUTH_TOKEN (gerado com "claude setup-token") fica no .env, fora do Git (D13).
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
